<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Markets and trading study</title>
  <desc id="desc">A stylized rising candlestick chart in warm gold against a dark burgundy background.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#311714"/>
      <stop offset="1" stop-color="#6b282b"/>
    </linearGradient>
    <linearGradient id="gold" x2="0" y2="1">
      <stop stop-color="#f0d1ad"/>
      <stop offset="1" stop-color="#b77b58"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#d49a73" stop-opacity=".2"/>
      <stop offset="1" stop-color="#d49a73" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>

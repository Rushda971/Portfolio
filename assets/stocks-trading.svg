    <rect x="302" y="495" width="56" height="80" rx="5"/>
    <rect x="422" y="535" width="56" height="75" rx="5"/>
    <rect x="542" y="415" width="56" height="90" rx="5"/>
    <rect x="662" y="455" width="56" height="85" rx="5"/>
    <rect x="782" y="315" width="56" height="100" rx="5"/>
    <rect x="902" y="365" width="56" height="95" rx="5"/>
    <rect x="1022" y="230" width="56" height="110" rx="5"/>
